<div class="auth-container">
  <div class="auth-card">
    <h2>Regisztráció</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">E-mail cím</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required>
      </div>

      <div class="form-group">
        <label for="password">Jelszó</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Jelszó újra</label>
        <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required>
      </div>

      <button type="submit" class="auth-btn">Fiók létrehozása</button>
    </form>

    <p class="switch-page">
      Már van fiókod? <a routerLink="/login">Lépj be itt!</a>
    </p>
  </div>
</div>
